name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Wff.sln --no-incremental --configuration Release

      - name: Test
        run: dotnet test tests/Wff.Tests/Wff.Tests.csproj --no-build --configuration Release

      - name: Package
        shell: powershell
        run: .\build\package.ps1 -SkipBuild -SkipTests

      - name: Read changelog section
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $content = Get-Content CHANGELOG.md -Raw
          # Match "## [1.0.1] - date" or "## [1.0.1]" through the next "## "
          $pattern = "(?ms)^## \[\Q$($tag.TrimStart('v'))\E\][^\r\n]*\r?\n(.*?)(?=^## |\z)"
          $m = [regex]::Match($content, $pattern)
          $body = if ($m.Success -and $m.Groups[1].Value.Trim()) { $m.Groups[1].Value.Trim() } else { "Release $tag — see CHANGELOG.md for details." }
          $body = "win-fast-finder $tag`n`n$body"
          # Delimiter unlikely to appear in the changelog
          $delim = '___WFF_RELEASE_BODY___'
          "body<<$delim" >> $env:GITHUB_OUTPUT
          $body >> $env:GITHUB_OUTPUT
          "$delim" >> $env:GITHUB_OUTPUT

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: win-fast-finder ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/win-fast-finder-Setup-*.exe
            dist/win-fast-finder-Setup-*.sha256
            dist/win-fast-finder-*-source.zip
            dist/win-fast-finder-*-source.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
