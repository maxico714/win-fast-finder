name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        run: dotnet build Wff.sln --no-incremental --configuration Release

      - name: Test
        run: dotnet test tests/Wff.Tests/Wff.Tests.csproj --no-build --configuration Release

      - name: Package
        shell: powershell
        run: .\build\package.ps1 -SkipBuild -SkipTests

      - name: Read changelog section
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $content = Get-Content CHANGELOG.md -Raw
          # .NET regex - use [regex]::Escape(), NOT Perl's \Q...\E
          $ver = [regex]::Escape($tag)
          $pattern = "(?ms)^## \[$ver\][^\r\n]*\r?\n(.*?)(?=^## |\z)"
          $m = [regex]::Match($content, $pattern)
          if ($m.Success -and $m.Groups[1].Value.Trim()) {
            $section = $m.Groups[1].Value.Trim()
          } else {
            $section = "Release v$tag - see CHANGELOG.md for details."
          }
          $body = "win-fast-finder v$tag`n`n$section"
          $delim = '___WFF_RELEASE_BODY___'
          "body<<$delim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $delim  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: win-fast-finder ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/win-fast-finder-Setup-*.exe
            dist/win-fast-finder-Setup-*.sha256
            dist/win-fast-finder-*-source.zip
            dist/win-fast-finder-*-source.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
