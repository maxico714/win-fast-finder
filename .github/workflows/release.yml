name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify tag matches Directory.Build.props
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $props = Get-Content Directory.Build.props -Raw
          $m = [regex]::Match($props, '<Version>([^<]+)</Version>')
          if (-not $m.Success) { throw "Could not read <Version> from Directory.Build.props" }
          $version = $m.Groups[1].Value.Trim()
          if ($tag -ne $version) {
            throw "Tag v$tag does not match <Version>$version</Version> in Directory.Build.props"
          }
          Write-Host "Tag v$tag matches Directory.Build.props version $version"

      - name: Build
        run: dotnet build Wff.sln --no-incremental --configuration Release

      - name: Test
        run: dotnet test tests/Wff.Tests/Wff.Tests.csproj --no-build --configuration Release

      - name: Package
        shell: powershell
        run: .\build\package.ps1 -SkipBuild -SkipTests -Tag "${{ github.ref_name }}"

      - name: Read changelog section
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $content = Get-Content CHANGELOG.md -Raw
          # .NET regex - use [regex]::Escape(), NOT Perl's \Q...\E
          $ver = [regex]::Escape($tag)
          $pattern = "(?ms)^## \[$ver\][^\r\n]*\r?\n(.*?)(?=^## |\z)"
          $m = [regex]::Match($content, $pattern)
          if ($m.Success -and $m.Groups[1].Value.Trim()) {
            $section = $m.Groups[1].Value.Trim()
          } else {
            $section = "Release v$tag - see CHANGELOG.md for details."
          }
          $body = "win-fast-finder v$tag`n`n$section"
          $delim = '___WFF_RELEASE_BODY___'
          "body<<$delim" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body   | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $delim  | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: win-fast-finder ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/win-fast-finder-Setup-*.exe
            dist/win-fast-finder-Setup-*.sha256
            dist/win-fast-finder-*-source.zip
            dist/win-fast-finder-*-source.zip.sha256
          fail_on_unmatched_files: true
          generate_release_notes: false
